name: tests
on:
  push: {branches: [main]}
  pull_request: {}
jobs:
  tests:
    # solo-saas: el repo es público; un runner propio correría el código de PRs de forks dentro de la red de casa, y un repo público no puede llamar ruta-perfil.yml de home-k8 (privado; acceso de Actions limitado a la org). El job es liviano (~10 s), no es falta de capacidad.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && python -m pytest -q tests
