name: tests
on:
  push: {branches: [main]}
  pull_request: {}
jobs:
  ruta:
    uses: the-software-co/home-k8/.github/workflows/ruta-perfil.yml@main
    with: { perfil: liviano }
  tests:
    needs: ruta
    runs-on: ${{ needs.ruta.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && python -m pytest -q tests
